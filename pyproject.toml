[project]
name = "dockhand-mcp-py"
version = "0.7.2"
description = "Python MCP Server for Dockhand Docker Management API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "roscocheeta" },
]
keywords = ["mcp", "dockhand", "docker", "fastmcp", "homelab", "containers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.scripts]
dockhand-mcp = "dockhand_mcp.server:main"

[project.urls]
Homepage = "https://github.com/roscocheeta/dockhand-mcp-py"
Repository = "https://github.com/roscocheeta/dockhand-mcp-py"
Issues = "https://github.com/roscocheeta/dockhand-mcp-py/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dockhand_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
